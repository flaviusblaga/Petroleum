<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prețuri raft — vizită petroliere</title>
<meta name="description" content="Dashboard editabil: prețuri Hell vs concurență la raft, oraș vs autostradă, stații OMV, Rompetrol, Lukoil, MOL, Petrom.">
<meta name="theme-color" content="#d81e2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prețuri Hell">
<style>
  :root{
    --bg:#f5f3f0;--surface:#ffffff;--surface-2:#faf8f5;
    --ink:#1c1815;--ink-2:#5a524a;--ink-3:#8b8177;
    --line:#e7e1da;--line-strong:#d8d0c6;
    --hell:#d81e2c;--hell-soft:#fbe9ea;--hell-ink:#a81421;--coffee:#a9682e;
    --heat-0:#f2f0ed;--heat-1:#dcd8d2;--heat-2:#c2bdb5;--heat-3:#a6a099;--heat-ink:#1c1815;
    --promo:#0f7a5a;--promo-soft:#e2f2eb;--warn:#c2521f;
    --shadow:0 1px 2px rgba(28,24,21,.05),0 6px 20px rgba(28,24,21,.06);
    --st-omv:#2f5bc4;--st-rom:#7a4fb5;--st-luk:#c77a16;--st-mol:#0f8b7e;--st-pet:#c9772a;
    --f-disp:'Segoe UI Variable Display','Segoe UI Semibold',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --f-body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#141210;--surface:#1e1b18;--surface-2:#242019;
      --ink:#f4efe8;--ink-2:#b6ada2;--ink-3:#877e73;
      --line:#332e28;--line-strong:#413a32;
      --hell:#ff4a56;--hell-soft:#3a1e20;--hell-ink:#ff8b93;--coffee:#d69a5f;
      --heat-0:#242019;--heat-1:#332e27;--heat-2:#443e35;--heat-3:#565046;--heat-ink:#f4efe8;
      --promo:#43c79a;--promo-soft:#17332a;--warn:#f0925a;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
      --st-omv:#6f97ee;--st-rom:#b18ce0;--st-luk:#e2a54e;--st-mol:#3fbfb0;--st-pet:#e59a4e;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141210;--surface:#1e1b18;--surface-2:#242019;
    --ink:#f4efe8;--ink-2:#b6ada2;--ink-3:#877e73;
    --line:#332e28;--line-strong:#413a32;
    --hell:#ff4a56;--hell-soft:#3a1e20;--hell-ink:#ff8b93;--coffee:#d69a5f;
    --heat-0:#242019;--heat-1:#332e27;--heat-2:#443e35;--heat-3:#565046;--heat-ink:#f4efe8;
    --promo:#43c79a;--promo-soft:#17332a;--warn:#f0925a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --st-omv:#6f97ee;--st-rom:#b18ce0;--st-luk:#e2a54e;--st-mol:#3fbfb0;--st-pet:#e59a4e;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1160px;margin:0 auto;padding:28px 22px 72px}

  .head{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--hell);font-weight:600;margin:0 0 6px}
  h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
  .sub{color:var(--ink-2);margin:10px 0 0;max-width:60ch;font-size:15px}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--ink-3);color:var(--ink)}
  .btn.lang{font-weight:600;color:var(--ink)}
  .btn.lang b{color:var(--hell)}
  .btn.on{background:var(--hell);border-color:var(--hell);color:#fff}
  .btn.on:hover{color:#fff}

  .stations{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 18px}
  .st{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13px;box-shadow:var(--shadow)}
  .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .st b{font-weight:600}

  .zonebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 26px}
  .zonelab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
  .tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
  .tab{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13.5px;font-weight:500;padding:7px 16px;border-radius:999px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
  .tabs.zones .tab[aria-selected="true"]{background:var(--hell);color:#fff}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:30px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi.hero{border-color:var(--hell);background:linear-gradient(180deg,var(--hell-soft),var(--surface))}
  .kpi .lab{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0 0 8px;min-height:2.2em}
  .kpi .big{font-family:var(--f-disp);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.08;font-variant-numeric:tabular-nums}
  .kpi.hero .big{color:var(--hell-ink)}
  .kpi .note{font-size:12.5px;color:var(--ink-2);margin:8px 0 0}

  section{margin-top:40px}
  .sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
  h2{font-family:var(--f-disp);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:0}
  .sec-sub{color:var(--ink-3);font-size:13px;margin:2px 0 18px}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .toolbar .spacer{flex:1 1 auto}
  .hint{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--hell);border-radius:8px;padding:9px 13px;margin:0 0 14px}

  .chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;box-shadow:var(--shadow)}
  .chart h3{font-family:var(--f-disp);font-size:15px;font-weight:700;margin:0 0 2px}
  .chart .cap{font-size:12.5px;color:var(--ink-3);margin:0 0 20px}
  .bars{display:flex;flex-direction:column;gap:11px}
  .bar-row{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center}
  .bar-name{font-size:13.5px;font-weight:500;text-align:right;color:var(--ink-2)}
  .bar-row.is-hell .bar-name{color:var(--hell-ink);font-weight:700}
  .bar-track{position:relative;height:26px;display:flex;align-items:center}
  .bar-fill{height:26px;border-radius:0 5px 5px 0;background:var(--line-strong);min-width:2px;transition:width .7s cubic-bezier(.2,.7,.2,1)}
  .bar-row.is-hell .bar-fill{background:var(--hell)}
  .bar-val{margin-left:9px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
  .bar-row.is-hell .bar-val{color:var(--hell-ink)}
  .chart-empty{color:var(--ink-3);font-size:13px;padding:6px 0}

  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  table.zone{min-width:860px}
  table.cmp{min-width:1120px}
  thead th{background:var(--surface-2);text-align:right;font-size:12px;font-weight:600;color:var(--ink-2);padding:11px 14px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
  thead th:first-child{text-align:left}
  thead th .dot{display:inline-block;margin-right:6px;vertical-align:middle}
  table.cmp thead th.grp{text-align:center;border-left:1px solid var(--line)}
  table.cmp thead th.sub{font-weight:500;color:var(--ink-3);font-size:11px}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:right;font-size:14px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  table.cmp td.grpsep{border-left:1px solid var(--line)}
  .pname{text-align:left;font-weight:500}
  .pname .fmt{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:1px}
  .cat-row td{background:var(--surface-2);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700;color:var(--ink-3);text-align:left;padding:9px 14px}
  tr.hell{background:var(--hell-soft)}
  tr.hell .pname{color:var(--hell-ink);font-weight:700}
  .cell{display:inline-flex;flex-direction:column;align-items:flex-end;gap:3px}
  .price{font-weight:600}
  .heat{display:inline-block;padding:2px 8px;border-radius:6px;color:var(--heat-ink)}
  .promo{font-size:11px;font-weight:600;color:var(--promo);background:var(--promo-soft);border-radius:5px;padding:1px 6px;white-space:nowrap}
  .na{color:var(--ink-3)}
  .dpos{color:var(--hell-ink);font-weight:700}
  .dneg{color:var(--ink-2);font-weight:600}
  .dzero{color:var(--ink-3)}
  .u{color:var(--ink-3);cursor:help;border-bottom:1px dotted var(--ink-3)}
  .pin{width:72px;padding:5px 7px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
  .pin::placeholder{color:var(--ink-3)}
  .pin.promo-in{width:66px;margin-top:4px;color:var(--promo)}
  .pin:focus{outline:2px solid var(--hell);outline-offset:1px;border-color:var(--hell)}

  .notes{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--hell);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
  .notes h3{font-family:var(--f-disp);font-size:14px;margin:0 0 10px}
  .notes ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
  .notes li{margin:6px 0}
  .notes b{color:var(--ink)}
  .foot{margin-top:30px;color:var(--ink-3);font-size:12px;line-height:1.7}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:14px 0 0}
  .legend span.item{display:inline-flex;align-items:center;gap:6px}
  .sw{width:26px;height:12px;border-radius:3px;background:linear-gradient(90deg,var(--heat-0),var(--heat-3))}
  @media (max-width:560px){.bar-row{grid-template-columns:96px 1fr}.bar-name{font-size:12px}}
  input[type=file]{display:none}
  body.exporting .controls,body.exporting #editbtn,body.exporting #pdfbtn,body.exporting #csvbtn,body.exporting #jsonbtn,body.exporting #impbtn,body.exporting #resetbtn,body.exporting .photobar{display:none!important}
  body.exporting .toolbar{margin-bottom:6px}
  body.exporting .tablewrap{overflow:visible!important}

  @media print{
    @page{size:A4 landscape;margin:11mm}
    :root,:root[data-theme="light"],:root[data-theme="dark"]{
      --bg:#fff;--surface:#fff;--surface-2:#f4f2ef;--ink:#111;--ink-2:#333;--ink-3:#666;--line:#ccc;--line-strong:#999;
      --hell:#d81e2c;--hell-soft:#fbe9ea;--hell-ink:#a81421;
      --heat-0:#f2f0ed;--heat-1:#dcd8d2;--heat-2:#c2bdb5;--heat-3:#a6a099;--heat-ink:#111;
      --promo:#0a7a52;--promo-soft:#e2f2eb;--shadow:none;
    }
    html,body{background:#fff!important;color:#111!important}
    body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .wrap{max-width:none!important;padding:0!important}
    .controls,.zonebar,.toolbar,.photobar,.hint,.sub,input,select,button,.btn{display:none!important}
    #chartsec,.chart{break-inside:avoid}
    .chart{border:1px solid #ccc;padding:14px}
    .bar-fill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    section{margin-top:14px!important}
    .sec-h h2{font-size:15px}
    .kpis{display:flex!important;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .kpi{flex:1 1 22%;padding:8px 10px;border:1px solid #ccc!important;break-inside:avoid}
    .kpi .lab{min-height:auto}
    .kpi .big{font-size:17px}
    .tablewrap{overflow:visible!important;border:1px solid #ccc}
    table{min-width:0!important;width:100%!important;font-size:9px}
    table.cmp{font-size:7.5px}
    thead th,tbody td{padding:4px 6px}
    thead th{position:static}
    tr,.kpi,.photocard,.notes{break-inside:avoid}
    .heat{color:#111!important}
    .notes{border:1px solid #ccc;margin-top:14px}
    .photogrid{grid-template-columns:repeat(5,1fr);gap:8px}
    .photocard{border:1px solid #ccc}
    .photocard img{height:78px}
    h1{font-size:20px}
    .foot{font-size:9px}
  }
  .btn.install{background:var(--hell);border-color:var(--hell);color:#fff;font-weight:600}
  .btn.install:hover{color:#fff;filter:brightness(1.05)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;max-width:430px;width:100%;padding:22px 24px;box-shadow:var(--shadow)}
  .modal-card h3{font-family:var(--f-disp);margin:0 0 14px;font-size:18px}
  .modal-card p{margin:0 0 12px;font-size:14px;color:var(--ink-2);line-height:1.55}
  .modal-card p b{color:var(--ink)}
  .modal-card .mnote{font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
  .photobar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .photobar select{padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
  .photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .photocard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow)}
  .photocard img{display:block;width:100%;height:130px;object-fit:cover;cursor:pointer}
  .photocard .meta{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-size:12px;color:var(--ink-2);gap:6px}
  .photocard .stn{font-weight:600;color:var(--ink)}
  .photocard .del{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1;padding:2px 5px;border-radius:6px}
  .photocard .del:hover{color:var(--hell)}
  .photoempty{grid-column:1/-1;color:var(--ink-3);font-size:13px;border:1px dashed var(--line-strong);border-radius:12px;padding:24px;text-align:center}
  .lightbox img{max-width:100%;max-height:82vh;border-radius:10px;display:block}
</style>

<div class="wrap">
  <header class="head">
    <div>
      <p class="eyebrow" data-k="eyebrow"></p>
      <h1 data-k="h1"></h1>
      <p class="sub" data-k="sub"></p>
    </div>
    <div class="controls">
      <button class="btn install" id="installbtn" type="button" hidden></button>
      <button class="btn lang" id="langbtn" type="button"></button>
      <button class="btn" id="themebtn" type="button"></button>
    </div>
  </header>

  <div class="stations" id="stations"></div>

  <div class="zonebar">
    <span class="zonelab" data-k="zoneLabel"></span>
    <div class="tabs zones" role="tablist" id="zones">
      <button class="tab" role="tab" aria-selected="true" data-z="city" data-k="zoneCity"></button>
      <button class="tab" role="tab" aria-selected="false" data-z="hw" data-k="zoneHw"></button>
      <button class="tab" role="tab" aria-selected="false" data-z="compare" data-k="zoneCompare"></button>
    </div>
  </div>

  <div class="kpis" id="kpis">
    <div class="kpi hero"><p class="lab" id="kl1"></p><div class="big" id="kv1"></div><p class="note" id="kn1"></p></div>
    <div class="kpi"><p class="lab" id="kl2"></p><div class="big" id="kv2"></div><p class="note" id="kn2"></p></div>
    <div class="kpi"><p class="lab" id="kl3"></p><div class="big" id="kv3"></div><p class="note" id="kn3"></p></div>
    <div class="kpi"><p class="lab" id="kl4"></p><div class="big" id="kv4"></div><p class="note" id="kn4"></p></div>
  </div>

  <section id="chartsec">
    <div class="sec-h"><h2 data-k="sec1h2"></h2></div>
    <p class="sec-sub" id="sec1sub"></p>
    <div class="chart">
      <h3 data-k="charth3"></h3>
      <p class="cap" data-k="chartcap"></p>
      <div class="bars" id="bars"></div>
    </div>
  </section>

  <section>
    <div class="sec-h"><h2 data-k="sec2h2"></h2></div>
    <p class="sec-sub" id="sec2sub"></p>

    <div class="toolbar">
      <button class="btn" id="editbtn" type="button"></button>
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" aria-selected="true" data-f="all" data-k="tabAll"></button>
        <button class="tab" role="tab" aria-selected="false" data-f="energy" data-k="tabEnergy"></button>
        <button class="tab" role="tab" aria-selected="false" data-f="coffee" data-k="tabCoffee"></button>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="pdfbtn" type="button"></button>
      <button class="btn" id="csvbtn" type="button"></button>
      <button class="btn" id="jsonbtn" type="button"></button>
      <button class="btn" id="impbtn" type="button"></button>
      <button class="btn" id="resetbtn" type="button"></button>
      <input type="file" id="fileinput" accept=".json,application/json">
    </div>
    <p class="hint" id="edithint" hidden data-k="editHint"></p>

    <div class="tablewrap">
      <table id="ptable" class="zone">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="legend" id="legend">
      <span class="item"><span class="sw"></span> <span data-k="legendHeat"></span></span>
      <span class="item"><span class="promo">promo</span> <span data-k="legendPromo"></span></span>
      <span class="item"><span style="color:var(--hell-ink);font-weight:700">▌Hell</span> <span data-k="legendHell"></span></span>
    </div>
  </section>

  <div class="notes">
    <h3 id="notesH3"></h3>
    <ul id="noteslist"></ul>
  </div>

  <section>
    <div class="sec-h"><h2 data-k="photosH2"></h2></div>
    <p class="sec-sub" data-k="photosSub"></p>
    <div class="photobar">
      <button class="btn" id="addphotobtn" type="button" data-k="photoAdd"></button>
      <select id="photoStation"></select>
      <input type="file" id="photoinput" accept="image/*" multiple>
    </div>
    <div class="photogrid" id="photogrid"></div>
  </section>

  <p class="foot">
    <span data-k="foot1"></span><br>
    <span data-k="foot2"></span><br>
    <span data-k="foot3"></span>
  </p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const STATIONS = [
  {k:'omv', name:'OMV',       v:'--st-omv'},
  {k:'rom', name:'Rompetrol', v:'--st-rom'},
  {k:'luk', name:'Lukoil',    v:'--st-luk'},
  {k:'mol', name:'MOL',       v:'--st-mol'},
  {k:'pet', name:'Petrom',    v:'--st-pet'},
];
const ZONES=['city','hw'];

const SEED = [
  {name:'Red Bull', short:'RB', fmt:{ro:'250 ml',en:'250 ml',hu:'250 ml'}, cat:'energy', prices:{omv:{p:11.30}, rom:{p:10.50}, luk:{p:12.49}}},
  {name:'Red Bull', short:'RB 355', fmt:{ro:'355 ml',en:'355 ml',hu:'355 ml'}, cat:'energy', prices:{omv:{p:15.60}, rom:{p:14.60}, luk:{p:16.99}}},
  {name:'Monster', fmt:{ro:'500 ml',en:'500 ml',hu:'500 ml'}, cat:'energy', prices:{omv:{p:11.00}, rom:{p:10.70,promo:8.00}, luk:{p:11.49,promo:7.49}}},

const STORE='pr_data_v4', OLD='pr_data_v3';
const LANGS=['ro','en','hu'];
let LANG='ro';
try{const s=localStorage.getItem('pr_lang'); if(LANGS.includes(s))LANG=s;}catch(e){}
const pick=(ro,en,hu)=>LANG==='hu'?hu:(LANG==='en'?en:ro);

// ---------- data (nested: prices[station][zone] = {p,promo,alt}) ----------
function buildData(){
  return SEED.map(p=>{
    const c=JSON.parse(JSON.stringify(p));
    const np={};
    for(const sk in c.prices){ np[sk]={city:c.prices[sk]}; }
    c.prices=np; return c;
  });
}
let data=buildData();
function loadData(){
  try{
    const raw=localStorage.getItem(STORE);
    if(raw){
      const s=JSON.parse(raw);
      if(s&&Array.isArray(s.prices)&&s.prices.length===SEED.length){ data.forEach((p,i)=>p.prices=s.prices[i]||{}); return; }
    }
    const old=localStorage.getItem(OLD); // migrate flat city prices
    if(old){
      const s=JSON.parse(old);
      if(s&&Array.isArray(s.prices)&&s.prices.length===SEED.length){
        data.forEach((p,i)=>{ const flat=s.prices[i]||{}; const np={}; for(const sk in flat){ np[sk]={city:flat[sk]}; } p.prices=np; });
        saveData();
      }
    }
  }catch(e){}
}
function saveData(){ try{ localStorage.setItem(STORE, JSON.stringify({v:4, prices:data.map(p=>p.prices)})); }catch(e){} }
loadData();

const T=()=>I[LANG];
const fmtNum=(n)=>Number(n).toLocaleString(I[LANG].locale,{minimumFractionDigits:2,maximumFractionDigits:2});
const parseNum=(s)=>{ if(s==null)return null; s=String(s).trim().replace(',','.'); if(s==='')return null; const v=parseFloat(s); return isFinite(v)?v:null; };
const getD=(p,sk,zone)=> p.prices[sk]&&p.prices[sk][zone];
function avgOf(p,zone){ const vals=STATIONS.map(s=>{const d=getD(p,s.k,zone); return d&&typeof d.p==='number'?d.p:null;}).filter(v=>v!=null); return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null; }
function comparePairs(){ const out=[]; data.forEach(p=>STATIONS.forEach(s=>{ const c=getD(p,s.k,'city'),h=getD(p,s.k,'hw'); if(c&&h&&typeof c.p==='number'&&typeof h.p==='number'&&c.p>0) out.push({name:(p.short||p.name),station:s.name,d:h.p-c.p,pct:(h.p-c.p)/c.p*100,hell:!!p.hell}); })); return out; }

// ---------- state ----------
let viewMode='city';   // 'city' | 'hw' | 'compare'
let editMode=false;
let currentFilter='all';
const chartZone=()=> viewMode==='compare'?'city':viewMode;

// ---------- render ----------
function renderStations(){
  document.getElementById('stations').innerHTML = STATIONS.map(s=>`<div class="st"><span class="dot" style="background:var(${s.v})"></span><b>${s.name}</b></div>`).join('');
}
function catRanges(zone){
  const r={};
  ['energy','coffee','csd'].forEach(c=>{ let v=[]; data.filter(p=>p.cat===c).forEach(p=>STATIONS.forEach(s=>{const d=getD(p,s.k,zone); if(d&&typeof d.p==='number')v.push(d.p);})); r[c]=v.length?[Math.min(...v),Math.max(...v)]:[0,1]; });
  return r;
}
function heatColor(v,min,max){ if(max===min)return 'var(--heat-0)'; const t=(v-min)/(max-min); const st=['--heat-0','--heat-1','--heat-2','--heat-3']; return `var(${st[Math.min(3,Math.floor(t*3+.0001))]})`; }

function renderTable(){

  const L=T();

    tbl.className='cmp';

    h+='</tr>'; th.innerHTML=h;
    tb.innerHTML=''; let lastCat=null;
    data.forEach(p=>{
      if(currentFilter!=='all'&&p.cat!==currentFilter)return;
      if(p.cat!==lastCat){lastCat=p.cat; const cr=document.createElement('tr'); cr.className='cat-row'; cr.innerHTML=`<td colspan="${1+STATIONS.length*3}">${L.cat[p.cat]}</td>`; tb.appendChild(cr);}
      const tr=document.createElement('tr'); if(p.hell)tr.className='hell';
      const nm=p.short?`${p.name} <span style="color:var(--ink-3);font-weight:400">${p.short}</span>`:p.name;
      let cells=`<td><span class="pname">${nm}</span></td>`;
      STATIONS.forEach(s=>{
        const c=getD(p,s.k,'city'),h2=getD(p,s.k,'hw');
        const cv=c&&typeof c.p==='number'?fmtNum(c.p):'—';
        const hv=h2&&typeof h2.p==='number'?fmtNum(h2.p):'—';
        let dv='—',cls='dzero';
        if(c&&h2&&typeof c.p==='number'&&typeof h2.p==='number'&&c.p>0){const pct=(h2.p-c.p)/c.p*100; if(Math.abs(pct)<0.5){dv='0%';cls='dzero';}else{dv=(pct>0?'+':'−')+Math.round(Math.abs(pct))+'%';cls=pct>0?'dpos':'dneg';}}
        cells+=`<td class="grpsep">${cv}</td><td>${hv}</td><td class="${cls}">${dv}</td>`;
      });
      tr.innerHTML=cells; tb.appendChild(tr);
    });
    return;
  }
  // zone table
  tbl.className='zone';
  const zone=viewMode;
  th.innerHTML='<tr><th>'+L.thProduct+'</th>'+STATIONS.map(s=>`<th>${s.name}</th>`).join('')+'</tr>';
  tb.innerHTML=''; const rng=catRanges(zone); let lastCat=null;
  data.forEach((p,pi)=>{
    if(currentFilter!=='all'&&p.cat!==currentFilter)return;
    if(p.cat!==lastCat){lastCat=p.cat; const cr=document.createElement('tr'); cr.className='cat-row'; cr.innerHTML=`<td colspan="${STATIONS.length+1}">${L.cat[p.cat]}</td>`; tb.appendChild(cr);}
    const tr=document.createElement('tr'); if(p.hell)tr.className='hell';

  ov.innerHTML=`<div class="modal-card"><h3>${L.installTitle}</h3><p>${L.installIos}</p><p>${L.installAndroid}</p><p class="mnote">${L.installNote}</p><div style="text-align:right;margin-top:6px"><button class="btn close" type="button">${L.installClose}</button></div></div>`;
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('.close'))ov.remove();});
  document.body.appendChild(ov);
});
setupPWA();

// ---------- Poze din stații (IndexedDB) ----------
let photoDB=null;
function openPhotoDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('hellPhotos',1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function photoStore(mode){if(!photoDB)photoDB=await openPhotoDB();return photoDB.transaction('photos',mode).objectStore('photos');}
async function photoAllRecs(){try{const st=await photoStore('readonly');return await new Promise(r=>{const q=st.getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([]);});}catch(e){return[];}}
async function photoPut(rec){const st=await photoStore('readwrite');return new Promise((res,rej)=>{const q=st.put(rec);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});}
async function photoRemove(id){try{const st=await photoStore('readwrite');await new Promise(r=>{const q=st.delete(id);q.onsuccess=()=>r();q.onerror=()=>r();});}catch(e){}}
function compressImage(file,maxDim,quality){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);let w=img.naturalWidth,h=img.naturalHeight;const sc=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);try{res(c.toDataURL('image/jpeg',quality));}catch(e){rej(e);}};img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;});}
const photoStationSel=document.getElementById('photoStation');
const photoinput=document.getElementById('photoinput'), photogrid=document.getElementById('photogrid');
function fillPhotoStations(){const cur=photoStationSel.value;photoStationSel.innerHTML=`<option value="">${T().photoGeneral}</option>`+STATIONS.map(s=>`<option value="${s.k}">${s.name}</option>`).join('');photoStationSel.value=cur;}
async function renderPhotos(){const L=T();const list=(await photoAllRecs()).sort((a,b)=>b.id-a.id);const stn=k=>{const s=STATIONS.find(x=>x.k===k);return s?s.name:L.photoGeneral;};photogrid.innerHTML = list.length? list.map(p=>`<div class="photocard"><img src="${p.src}" data-id="${p.id}" alt="${stn(p.station)}"><div class="meta"><span class="stn">${stn(p.station)}</span><span>${p.date||''}</span><button class="del" data-del="${p.id}" title="${L.photoDelTitle}">✕</button></div></div>`).join('') : `<div class="photoempty">${L.photoEmpty}</div>`;}
document.getElementById('addphotobtn').addEventListener('click',()=>photoinput.click());
photoinput.addEventListener('change',async e=>{const files=[...(e.target.files||[])];if(!files.length)return;const station=photoStationSel.value,date=new Date().toISOString().slice(0,10);for(const f of files){try{const src=await compressImage(f,1400,0.72);await photoPut({id:Date.now()+Math.floor(Math.random()*1000),station,date,src});}catch(err){}}e.target.value='';renderPhotos();});
photogrid.addEventListener('click',async e=>{const del=e.target.closest('[data-del]');if(del){if(confirm(T().photoDelConfirm)){await photoRemove(+del.dataset.del);renderPhotos();}return;}const img=e.target.closest('img[data-id]');if(img){const ov=document.createElement('div');ov.className='modal';ov.innerHTML=`<div class="lightbox"><img src="${img.src}"></div>`;ov.addEventListener('click',()=>ov.remove());document.body.appendChild(ov);}});
fillPhotoStations(); renderPhotos();

renderAll(true);
</script>
